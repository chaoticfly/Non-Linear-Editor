name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: amd64
            output: LikhiLakeerain.exe
          - os: macos-latest
            platform: darwin
            arch: universal
            output: likhi-lakeerain.app
          # - os: ubuntu-latest
          #   platform: linux
          #   arch: amd64
          #   output: LikhiLakeerain

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # - name: Build (Linux)
      #   if: matrix.platform == 'linux'
      #   run: |
      #     wails3 build GOOS=${{ matrix.platform }} ARCH=${{ matrix.arch }}

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          wails3 build GOOS=${{ matrix.platform }} ARCH=${{ matrix.arch }}

      - name: Build (macOS)
        if: matrix.platform == 'darwin'
        run: |
          wails3 task darwin:package:universal

      - name: List build output (macOS)
        if: matrix.platform == 'darwin'
        run: ls -laR bin/

      - name: List build output (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Get-ChildItem -Recurse bin/

      - name: Create archive (Windows)
        if: matrix.platform == 'windows'
        run: Compress-Archive -Path bin/${{ matrix.output }} -DestinationPath likhi-lakeerain-${{ matrix.platform }}-${{ matrix.arch }}.zip
        shell: pwsh

      - name: Create archive (macOS)
        if: matrix.platform == 'darwin'
        run: |
          cd bin
          zip -r ../../likhi-lakeerain-${{ matrix.platform }}-${{ matrix.arch }}.zip ${{ matrix.output }}

      # - name: Create archive (Linux)
      #   if: matrix.platform == 'linux'
      #   run: |
      #     cd build/bin
      #     zip -r ../../../LikhiLakeerain-${{ matrix.platform }}-${{ matrix.arch }}.zip ${{ matrix.output }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: likhi-lakeerain-${{ matrix.platform }}-${{ matrix.arch }}
          path: likhi-lakeerain-${{ matrix.platform }}-${{ matrix.arch }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
